<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Página no encontrada · FRAGRANCE OBSESSION</title>
  <meta name="description" content="La página que buscas no existe o fue movida. Vuelve al inicio para explorar nuestros decants premium." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Manrope:wght@300;400;500;600;700&display=swap" media="print" onload="this.media='all'" />
  <style>
    :root {
      --gold: #C99B5F; --gold-light: #E5C896; --gold-deep: #A67C3D;
      --bg: #0d0a06; --text: #F5EFE6; --text-sec: #C9B8A3;
      --font-body: 'Manrope', sans-serif; --font-display: 'Cormorant Garamond', serif;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: var(--font-body); background: var(--bg); color: var(--text);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      overflow: hidden; position: relative;
    }
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none;
      background: radial-gradient(circle at 30% 40%, rgba(201,155,95,.06), transparent 60%),
                  radial-gradient(circle at 70% 60%, rgba(201,155,95,.04), transparent 50%);
    }
    .container { text-align: center; padding: 2rem; position: relative; z-index: 1; }
    .code {
      font-family: var(--font-display); font-size: clamp(6rem, 15vw, 12rem);
      font-weight: 300; line-height: 1; letter-spacing: .05em;
      background: linear-gradient(135deg, var(--gold-light), var(--gold), var(--gold-deep));
      -webkit-background-clip: text; background-clip: text; color: transparent;
      margin-bottom: 1rem; animation: fadeIn 1s ease both;
    }
    .title {
      font-family: var(--font-display); font-size: clamp(1.5rem, 3vw, 2.2rem);
      font-weight: 300; letter-spacing: .04em; margin-bottom: 1rem; animation: fadeIn 1s .2s ease both;
    }
    .msg {
      color: var(--text-sec); font-size: .95rem; max-width: 420px; margin: 0 auto 2.5rem;
      line-height: 1.8; font-weight: 300; animation: fadeIn 1s .4s ease both;
    }
    .actions { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; animation: fadeIn 1s .6s ease both; }
    .btn {
      display: inline-flex; align-items: center; gap: .5rem; padding: 1rem 2.4rem;
      font-size: .75rem; font-weight: 600; letter-spacing: .12em; text-transform: uppercase;
      border: none; border-radius: 9999px; cursor: pointer; transition: all .4s cubic-bezier(.16,1,.3,1);
      font-family: var(--font-body); text-decoration: none;
    }
    .btn-gold {
      background: linear-gradient(135deg, var(--gold-light), var(--gold), var(--gold-deep));
      color: #fff; box-shadow: 0 8px 32px rgba(201,155,95,.4);
    }
    .btn-gold:hover { transform: translateY(-3px) scale(1.02); box-shadow: 0 18px 48px rgba(201,155,95,.55); }
    .btn-ghost {
      background: rgba(255,255,255,.06); color: var(--text); border: 1px solid rgba(255,255,255,.15);
      backdrop-filter: blur(8px);
    }
    .btn-ghost:hover { background: rgba(255,255,255,.12); border-color: var(--gold); color: var(--gold-light); transform: translateY(-3px); }
    .particle {
      position: fixed; width: 3px; height: 3px; background: var(--gold); border-radius: 50%;
      opacity: 0; animation: float 8s infinite ease-in-out;
    }
    @keyframes fadeIn { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
    @keyframes float {
      0% { opacity:0; transform:translateY(100vh) scale(0); }
      10% { opacity:.6; }
      90% { opacity:.6; }
      100% { opacity:0; transform:translateY(-10vh) scale(1); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <div class="particle" style="left:10%;animation-delay:0s;animation-duration:7s"></div>
  <div class="particle" style="left:25%;animation-delay:1.2s;animation-duration:9s"></div>
  <div class="particle" style="left:45%;animation-delay:2.5s;animation-duration:6s"></div>
  <div class="particle" style="left:65%;animation-delay:0.8s;animation-duration:8s"></div>
  <div class="particle" style="left:85%;animation-delay:3s;animation-duration:10s"></div>
  <div class="particle" style="left:50%;animation-delay:1.8s;animation-duration:7.5s"></div>
  <div class="particle" style="left:75%;animation-delay:4s;animation-duration:6.5s"></div>
  <div class="particle" style="left:35%;animation-delay:2s;animation-duration:8.5s"></div>

  <div class="container">
    <div class="code">404</div>
    <h1 class="title">Esta fragancia no existe</h1>
    <p class="msg">La página que buscas no existe o fue movida a otro lugar. Explora nuestros decants premium de perfumes árabes, de diseñador y nicho.</p>
    <div class="actions">
      <a href="index.html" class="btn btn-gold">Volver al Inicio</a>
      <a href="index.html#catalogo" class="btn btn-ghost">Ver Catálogo</a>
    </div>
  </div>
</body>
</html>
